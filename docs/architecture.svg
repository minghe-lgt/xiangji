<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','PingFang SC','Microsoft YaHei',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1512"/>
      <stop offset="100%" stop-color="#12100d"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="480" y="46" text-anchor="middle" fill="#d4a054" font-size="20" font-weight="700" letter-spacing="2">光影手帐 · 纯静态结构</text>
  <text x="480" y="70" text-anchor="middle" fill="#8a7d6c" font-size="12">无后端 · 无构建 · 照片只在浏览器内存中</text>

  <!-- 壳层 -->
  <rect x="60" y="96" width="840" height="64" rx="10" fill="#241f19" stroke="#3a322a"/>
  <text x="80" y="122" fill="#f0e6d6" font-size="14" font-weight="600">壳层</text>
  <text x="80" y="142" fill="#8a7d6c" font-size="11">侧栏导航（学习 / 拍摄工具 / 输出）· 区块路由 · 弹层体系</text>
  <rect x="480" y="110" width="150" height="30" rx="6" fill="#2e2720" stroke="#4a4036"/>
  <text x="555" y="130" text-anchor="middle" fill="#d4a054" font-size="12">index.html</text>
  <rect x="650" y="110" width="150" height="30" rx="6" fill="#2e2720" stroke="#4a4036"/>
  <text x="725" y="130" text-anchor="middle" fill="#d4a054" font-size="12">styles.css</text>
  <rect x="820" y="110" width="60" height="30" rx="6" fill="#2e2720" stroke="#4a4036"/>
  <text x="850" y="130" text-anchor="middle" fill="#d4a054" font-size="12">app.js</text>

  <line x1="480" y1="160" x2="480" y2="188" stroke="#4a4036" stroke-width="1.5"/>

  <!-- 内容与数据层 -->
  <rect x="60" y="190" width="400" height="70" rx="10" fill="#241f19" stroke="#3a322a"/>
  <text x="80" y="214" fill="#f0e6d6" font-size="14" font-weight="600">内容与知识库</text>
  <text x="80" y="234" fill="#8a7d6c" font-size="11">data.js（24 周课程 · 66 题诊断题库 · 书单）</text>
  <text x="80" y="250" fill="#8a7d6c" font-size="11">filmrecipes.js（77 条胶片预设 · 参数近似映射）</text>

  <!-- 图像处理层 -->
  <rect x="500" y="190" width="400" height="70" rx="10" fill="#241f19" stroke="#3a322a"/>
  <text x="520" y="214" fill="#f0e6d6" font-size="14" font-weight="600">图像处理层（全部本地计算）</text>
  <text x="520" y="234" fill="#8a7d6c" font-size="11">raw.js 内嵌预览提取 · analyze.js 六维分析</text>
  <text x="520" y="250" fill="#8a7d6c" font-size="11">colorgrade.js 调色引擎（LUT + 分块异步）· cull.js 快选片</text>

  <line x1="480" y1="260" x2="480" y2="288" stroke="#4a4036" stroke-width="1.5"/>

  <!-- 功能模块层 -->
  <rect x="60" y="290" width="840" height="118" rx="10" fill="#241f19" stroke="#3a322a"/>
  <text x="80" y="316" fill="#f0e6d6" font-size="14" font-weight="600">功能模块</text>
  <g font-size="12" fill="#d4a054">
    <rect x="80" y="330" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="170" y="349" text-anchor="middle">quiz.js 能力诊断</text>
    <rect x="276" y="330" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="366" y="349" text-anchor="middle">report.js 学习报告</text>
    <rect x="472" y="330" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="562" y="349" text-anchor="middle">organize.js 照片管家</text>
    <rect x="668" y="330" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="758" y="349" text-anchor="middle">tools.js 计算器/水印</text>
    <rect x="80" y="368" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="170" y="387" text-anchor="middle">作业 AI 批改（可选）</text>
    <rect x="276" y="368" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="366" y="387" text-anchor="middle">AI 深度点评（可选）</text>
    <rect x="472" y="368" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="562" y="387" text-anchor="middle">AI 精评（可选）</text>
    <rect x="668" y="368" width="180" height="28" rx="6" fill="#2e2720" stroke="#4a4036"/><text x="758" y="387" text-anchor="middle">AI 调色（可选）</text>
  </g>

  <line x1="480" y1="408" x2="480" y2="436" stroke="#4a4036" stroke-width="1.5"/>

  <!-- 持久化与 AI -->
  <rect x="60" y="438" width="400" height="76" rx="10" fill="#241f19" stroke="#d4a054" stroke-opacity="0.5"/>
  <text x="80" y="462" fill="#f0e6d6" font-size="14" font-weight="600">localStorage 本地持久化</text>
  <text x="80" y="482" fill="#8a7d6c" font-size="11">计划打卡 · 学习记录 · 诊断基线 · 测验历史</text>
  <text x="80" y="498" fill="#8a7d6c" font-size="11">用户预设 · 作业点评 · 一键 JSON 备份/导入</text>

  <rect x="500" y="438" width="400" height="76" rx="10" fill="#241f19" stroke="#4a4036" stroke-dasharray="6 4"/>
  <text x="520" y="462" fill="#f0e6d6" font-size="14" font-weight="600">可选：大模型 API（用户自带 Key）</text>
  <text x="520" y="482" fill="#8a7d6c" font-size="11">OpenAI 兼容 / Anthropic 直连 · 90s 超时</text>
  <text x="520" y="498" fill="#8a7d6c" font-size="11">Key 只存本机 localStorage，不经过任何第三方</text>

  <text x="480" y="556" text-anchor="middle" fill="#6b6560" font-size="11">部署：GitHub Pages（静态托管）· 离线可跑（字体外链失败自动回退）</text>
</svg>
